<article class="service-card h-100">
  <div class="service-card-icon">{{ service.category.name[:1] }}</div>
  <div class="d-flex align-items-center gap-2 mt-3">
    <span class="category-label">{{ service.category.name }}</span>
  </div>
  <h3 class="h5 mt-3 mb-2"><a class="stretched-heading" href="{{ url_for('main.service_detail', service_id=service.id) }}">{{ service.title }}</a></h3>
  <p class="text-secondary service-card-description">{{ service.description|truncate(105) }}</p>
  <div class="service-card-bottom">
    <span class="price-label">From <strong>${{ "%.2f"|format(service.base_price) }}</strong></span>
    <a class="btn btn-outline-primary btn-sm" href="{{ url_for('main.service_detail', service_id=service.id) }}">View details</a>
  </div>
</article>
